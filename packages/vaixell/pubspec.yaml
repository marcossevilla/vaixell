name: vaixell
description: Checks architecture rules in Dart and Flutter repositories without resolving types or running pub get.
version: 0.1.0-dev.1
repository: https://github.com/marcossevilla/vaixell/tree/main/packages/vaixell
issue_tracker: https://github.com/marcossevilla/vaixell/issues
topics:
  - architecture
  - lints
  - cli

resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ^14.5.0
  args: ^2.7.0
  cli_completion: ^0.6.0
  glob: ^2.2.0
  io: ^1.1.0
  mason_logger: ^0.3.5
  path: ^1.9.1
  pub_updater: ^0.6.0
  yaml: ^3.1.4

dev_dependencies:
  build_runner: ^2.16.1
  build_verify: ^3.1.1
  build_version: ^2.1.3
  mocktail: ^1.0.5
  test: ^1.33.0
  test_descriptor: ^2.0.2
  test_process: ^2.1.1
  very_good_analysis: ^11.0.0

executables:
  vaixell:
