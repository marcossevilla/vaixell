name: pub_publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # tag pattern on pub.dev: 'v{{version}}'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vaixell
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.0"

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 📢 Publish
        run: dart pub publish --force
