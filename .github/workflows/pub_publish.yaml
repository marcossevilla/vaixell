name: pub_publish

on:
  push:
    tags:
      - "vaixell-v[0-9]+.[0-9]+.[0-9]+*" # tag pattern on pub.dev: 'vaixell-v{{version}}'
      - "vaixell_cli-v[0-9]+.[0-9]+.[0-9]+*" # tag pattern on pub.dev: 'vaixell_cli-v{{version}}'

permissions:
  contents: read

jobs:
  publish-vaixell:
    if: startsWith(github.ref_name, 'vaixell-v')
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/vaixell

  publish-vaixell-cli:
    if: startsWith(github.ref_name, 'vaixell_cli-v')
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/vaixell_cli
