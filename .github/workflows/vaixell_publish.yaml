name: vaixell_publish

on:
  push:
    tags:
      - "vaixell-v[0-9]+.[0-9]+.[0-9]+*" # tag pattern on pub.dev: 'vaixell-v{{version}}'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/vaixell
