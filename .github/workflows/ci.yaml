name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.sdk }})
    strategy:
      fail-fast: false
      matrix:
        # `stable` plus the SDK lower bound from pubspec.yaml.
        sdk: [stable, 3.13.0]
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v2
    with:
      dart_sdk: ${{ matrix.sdk }}
      analyze_directories: bin lib test
      report_on: lib
      min_coverage: 100
