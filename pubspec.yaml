name: theseus_cli
description: Checks architecture rules in Dart and Flutter repositories without resolving types or running pub get.
version: 0.1.0-dev.1
repository: https://github.com/marcossevilla/theseus
issue_tracker: https://github.com/marcossevilla/theseus/issues
topics:
  - architecture
  - lints
  - cli

environment:
  sdk: ^3.12.0

executables:
  theseus_cli: theseus
  theseus: theseus

dependencies:
  analyzer: ^14.5.0
  args: ^2.7.0
  io: ^1.1.0
  path: ^1.9.1

dev_dependencies:
  coverage: ^1.16.0
  test: ^1.33.0
  test_descriptor: ^2.0.2
  test_process: ^2.1.1
  very_good_analysis: ^10.3.0
  yaml: ^3.1.4
